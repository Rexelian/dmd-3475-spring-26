<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Learning about Fetch</h1> 
    
    <ul id="catFacts">

    </ul>

    <script>
        var simpleObject = {
            'name': 'Joeal',
            'role': 'factulty'
        }

        var catFacts = [];

        function renderList() {
            const ulElement = document.getElementById('catFacts');
            catFacts.forEach(fact => {
                const li = document.createElement('li');
                li.textContent = fact;
                ulElement.appendChild(li);
            });
        }

        function getCatFacts(count) {
            fetch('http://meowfacts.herokuapp.com')
                .then(response => response.json())
                .then(function (data) {
                    catFacts = data.data; 
                    renderList();
                });
        }

        getCatFacts(20);

        function getDogBreeds() {
            //get first 10 breeds
            fetch('https://dogapi.dog/api/v2/breeds')
                .then(response => response.json())
                .then(function(data) {
                    var dogBreeds = data.data; 

                    console.log(dogBreeds[0]);
                    console.log(dogBreeds[0].attributes.female_weight.max);
                })

        }

        getDogBreeds();

    </script>
</body>
</html>
